<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasteVinhKhanh — Vendor Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">🍜 TasteVinhKhanh</div>
            <h1>Vendor Portal</h1>
            <p>Quản lý điểm thuyết minh của bạn</p>

            <div id="alertBox" class="alert alert-error" style="display:none"></div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-control"
                       value="vendor@vinhkhanh.com" placeholder="vendor@vinhkhanh.com">
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" class="form-control"
                       placeholder="••••••••">
            </div>

            <button class="btn btn-primary" style="width:100%; justify-content:center; padding:10px"
                    onclick="doLogin()" id="loginBtn">
                Đăng nhập
            </button>

            <p class="switch-mode">
                Chưa có tài khoản? <a href="#" onclick="showRegister(); return false;">Đăng kí ngay</a>
            </p>
        </div>

        <!-- REGISTER FORM -->
        <div class="register-card" id="registerCard" style="display:none">
            <div class="login-logo">🍜 TasteVinhKhanh</div>
            <h1>Đăng kí Vendor</h1>
            <p>Tạo tài khoản để quản lý điểm thuyết minh</p>

            <div id="regAlertBox" class="alert alert-error" style="display:none"></div>

            <div class="form-group">
                <label>Tên doanh nghiệp / Cửa hàng *</label>
                <input type="text" id="regBusinessName" class="form-control" placeholder="VD: Quán Cô Ba Bún Bò">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Tên chủ sở hữu *</label>
                    <input type="text" id="regOwnerName" class="form-control" placeholder="Họ và tên">
                </div>
                <div class="form-group">
                    <label>Số điện thoại *</label>
                    <input type="tel" id="regPhone" class="form-control" placeholder="VD: 0901234567" pattern="[0-9]{10}" maxlength="10" inputmode="numeric">
                </div>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="regEmail" class="form-control" placeholder="vendor@example.com">
            </div>

            <div class="form-group">
                <label>Địa chỉ</label>
                <input type="text" id="regAddress" class="form-control" placeholder="Địa chỉ cửa hàng">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Mật khẩu *</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Tối thiểu 6 kí tự">
                </div>
                <div class="form-group">
                    <label>Xác nhận mật khẩu *</label>
                    <input type="password" id="regConfirm" class="form-control" placeholder="Nhập lại mật khẩu">
                </div>
            </div>

            <button class="btn btn-primary" style="width:100%; justify-content:center; padding:10px"
                    onclick="doRegister()" id="registerBtn">
                Đăng kí
            </button>

            <p class="switch-mode">
                Đã có tài khoản? <a href="#" onclick="showLogin(); return false;">Đăng nhập</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
    if (isVendorLoggedIn()) window.location.href = 'dashboard.html';

    document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') doLogin();
    });

    function showRegister() {
        document.querySelector('.login-card').style.display = 'none';
        document.getElementById('registerCard').style.display = 'block';
    }

    function showLogin() {
        document.getElementById('registerCard').style.display = 'none';
        document.querySelector('.login-card').style.display = 'block';
    }

    async function doRegister() {
        const businessName = document.getElementById('regBusinessName').value.trim();
        const ownerName = document.getElementById('regOwnerName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const address = document.getElementById('regAddress').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;
        const alertBox = document.getElementById('regAlertBox');
        const btn = document.getElementById('registerBtn');

        if (!businessName || !ownerName || !phone || !email || !password || !confirm) {
            alertBox.textContent = 'Vui lòng điền đầy đủ thông tin bắt buộc (*).';
            alertBox.style.display = 'block';
            return;
        }

        if (password !== confirm) {
            alertBox.textContent = 'Mật khẩu xác nhận không khớp.';
            alertBox.style.display = 'block';
            return;
        }

        if (password.length < 8) {
            alertBox.textContent = 'Mật khẩu phải có ít nhất 8 kí tự và chứa ít nhất 1 chữ số.';
            alertBox.style.display = 'block';
            return;
        }

        if (!/\d/.test(password)) {
            alertBox.textContent = 'Mật khẩu phải chứa ít nhất 1 chữ số.';
            alertBox.style.display = 'block';
            return;
        }

        if (!/^\d{10}$/.test(phone)) {
            alertBox.textContent = 'Số điện thoại phải là 10 chữ số liên tiếp.';
            alertBox.style.display = 'block';
            return;
        }

        if (!phone.startsWith('0')) {
            alertBox.textContent = 'Số điện thoại phải bắt đầu bằng 0.';
            alertBox.style.display = 'block';
            return;
        }

        btn.textContent = 'Đang đăng kí...';
        btn.disabled = true;
        alertBox.style.display = 'none';

        const result = await vendorRegister(businessName, ownerName, email, password, phone, address);

        if (result.success) {
            showLogin();
            document.getElementById('email').value = email;
            showToast('Đăng kí thành công! Tài khoản đang chờ được quản trị viên duyệt.', 'success');
        } else {
            // Hiển thị message lỗi thật từ backend
            alertBox.textContent = result.message || 'Đăng kí thất bại. Vui lòng thử lại.';
            alertBox.style.display = 'block';
        }

        btn.textContent = 'Đăng kí';
        btn.disabled = false;
    }

    async function doLogin() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const alertBox = document.getElementById('alertBox');
        const btn = document.getElementById('loginBtn');

        if (!email || !password) {
            alertBox.textContent = 'Vui lòng nhập email và mật khẩu.';
            alertBox.style.display = 'block';
            return;
        }

        btn.textContent = 'Đang đăng nhập...';
        btn.disabled = true;
        alertBox.style.display = 'none';

        try {
            const ok = await vendorLogin(email, password);
            if (ok) {
                window.location.href = 'dashboard.html';
            }
        } catch (err) {
            alertBox.textContent = err.message || 'Email hoặc mật khẩu không đúng.';
            alertBox.style.display = 'block';
        }

        btn.textContent = 'Đăng nhập';
        btn.disabled = false;
    }

    function showToast(message, type) {
        let container = document.querySelector('.toast-container');
        if (!container) {
            container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
        }
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasteVinhKhanh Admin — Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-logo"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-utensils"/></svg> TasteVinhKhanh</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="active">
                    <span class="icon"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-bar-chart-2"/></svg></span> Dashboard
                </a>
                <a href="poi.html">
                    <span class="icon"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-map-pin"/></svg></span> Điểm thuyết minh
                </a>
                <a href="tour.html">
                    <span class="icon"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-map"/></svg></span> Quản lý Tours
                </a>
                <a href="vendors.html">
                    <span class="icon"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-store"/></svg></span> Vendors
                    <span class="nav-badge" id="vendorBadge" style="display:none;margin-left:auto">0</span>
                </a>
                <a href="pending-updates.html">
                    <span class="icon"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-clock"/></svg></span> Duyệt cập nhật
                    <span class="nav-badge nav-badge-warning" id="pendingBadge" style="display:none;margin-left:auto">0</span>
                </a>
            </nav>
            <div class="sidebar-bottom">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">A</div>
                    <div>
                        <div class="user-name" id="userName">Admin</div>
                        <div class="user-role">Quản trị viên</div>
                    </div>
                </div>
                <button class="btn btn-outline" style="width:100%; justify-content:center"
                        onclick="logout()">
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-log-out"/></svg> Đăng xuất
                </button>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main">
            <div class="topbar">
                <h2>Dashboard</h2>
            </div>

            <div class="content">

                <!-- STAT CARDS -->
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-icon blue"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-music"/></svg></div>
                        <div>
                            <div class="stat-value" id="totalPlays">—</div>
                            <div class="stat-label">Tổng lượt nghe</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-calendar"/></svg></div>
                        <div>
                            <div class="stat-value" id="todayPlays">—</div>
                            <div class="stat-label">Hôm nay</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon yellow"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-smartphone"/></svg></div>
                        <div>
                            <div class="stat-value" id="uniqueDevices">—</div>
                            <div class="stat-label">Thiết bị duy nhất</div>
                        </div>
                    </div>
                </div>

                <!-- TOP POI TABLE -->
                <div class="card">
                    <div class="table-header">
                        <h3><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-star"/></svg> Top điểm được nghe nhiều nhất</h3>
                    </div>

                    <div id="topLoading" class="loading">
                        <div class="spinner"></div>
                    </div>

                    <div class="table-wrapper" id="topWrapper" style="display:none">
                    <table id="topTable">
                        <thead>
                            <tr>
                                <th style="width:50px">Hạng</th>
                                <th>Tên điểm</th>
                                <th style="width:120px">Lượt nghe</th>
                                <th style="width:160px">Lần cuối</th>
                            </tr>
                        </thead>
                        <tbody id="topBody"></tbody>
                    </table>
                    </div>

                    <div id="topEmpty" class="empty-state" style="display:none">
                        <div class="empty-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-folder"/></svg></div>
                        <p>Chưa có dữ liệu thống kê</p>
                        <button class="btn btn-outline btn-sm" onclick="loadDashboard()" style="margin-top:8px">
                            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><use href="#icon-refresh"/></svg> Tải lại
                        </button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
    if (!requireAuth()) throw new Error('Not authenticated');

    async function loadDashboard() {
        try {
            // Load song song
            const [summary, topPois] = await Promise.all([getSummary(), getTopPois()]);

            // Stats
            document.getElementById('totalPlays').textContent = summary?.totalPlays ?? 0;
            document.getElementById('todayPlays').textContent = summary?.todayPlays ?? 0;
            document.getElementById('uniqueDevices').textContent = summary?.uniqueDevices ?? 0;

            // Top POI table
            document.getElementById('topLoading').style.display = 'none';

            if (!topPois || topPois.length === 0) {
                document.getElementById('topEmpty').style.display = 'block';
                return;
            }

            document.getElementById('topWrapper').style.display = 'block';
            document.getElementById('topTable').style.display = 'table';
            const tbody = document.getElementById('topBody');
            tbody.innerHTML = topPois.map((p, i) => `
                <tr>
                    <td><b>#${i + 1}</b></td>
                    <td>${p.poiName}</td>
                    <td><span class="badge badge-primary">${p.playCount}</span></td>
                    <td>${formatDate(p.lastPlayedAt)}</td>
                </tr>
            `).join('');

        } catch (e) {
            document.getElementById('topLoading').style.display = 'none';
            document.getElementById('topWrapper').style.display = 'none';
            document.getElementById('topEmpty').style.display = 'block';
        }
    }

    loadDashboard();

    // Load badge counts into sidebar
    getPendingStats().then(stats => {
        const pending = stats?.pending ?? 0;
        const badge = document.getElementById('pendingBadge');
        if (pending > 0 && badge) {
            badge.textContent = pending > 99 ? '99+' : pending;
            badge.style.display = 'inline-block';
        }
    }).catch(() => {});
    </script>
